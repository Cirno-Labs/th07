# th07: 東方妖々夢 ~ Perfect Cherry Blossom, 1.00b

[game]
name = "th07"
title = "東方妖々夢 1.00b"
window_title = "東方妖々夢"
dir = "orig/th07_100b"
exe = "th07.exe"
checksums = "orig/th07_100b.sha1"
original = "build/th07_100b.exe"
game_end = 0x46004B  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th07_100b"
functions = "build/functions_100b.csv"

[build]
cflags = ["/Od", "/Ob1", "/Gr", "/GX", "/Oi", "/Gy", "/GF", "/MT"]

[exe]
# Like the original, the exe's objects are compiled with /GL and linked
# with /LTCG, which puts each object's inline functions first.
obj_dir = "build/obj_gl"
cflags = ["/GL", "/DTH07_EXE"]
link_order = "median"
ldflags = ["/LTCG", "/SUBSYSTEM:WINDOWS", "/FIXED", "/OPT:REF", "/OPT:ICF", "/OPT:NOWIN98",
           "/NODEFAULTLIB:libc.lib"]
# The original's import table lists DINPUT8, DSOUND and d3d8 first and
# ole32 last; D3DX8 follows the game code and the CRT comes last.
libs = ["dinput8.lib", "dsound.lib", "d3d8.lib", "d3dx8.lib", "dxguid.lib", "winmm.lib",
        "kernel32.lib", "user32.lib", "gdi32.lib", "ole32.lib", "uuid.lib", "libcmt.lib"]

[psdk]
libs = ["Gdi32.Lib", "Kernel32.Lib", "Ole32.Lib", "User32.Lib", "Uuid.Lib", "WinMM.Lib"]

[hooks]
progress = true
